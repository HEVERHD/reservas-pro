name: Generar migración

# Crea una migración de EF Core a partir del modelo actual y la sube como commit a la rama elegida.
# Se ejecuta a mano desde Actions → Generar migración → Run workflow.
on:
  workflow_dispatch:
    inputs:
      nombre:
        description: Nombre de la migración (letras y números, por ejemplo Inicial o AgregarNotasACitas)
        required: true
        default: Inicial

permissions:
  contents: write # solo para subir el commit con la migración

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Validar el nombre
        env:
          NOMBRE: ${{ inputs.nombre }}
        run: |
          if ! [[ "$NOMBRE" =~ ^[A-Z][A-Za-z0-9]{1,60}$ ]]; then
            echo "::error::El nombre debe empezar con mayúscula y tener solo letras y números"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Generar la migración
        env:
          NOMBRE: ${{ inputs.nombre }}
        run: |
          dotnet tool restore
          dotnet ef migrations add "$NOMBRE" --project src/ReservasPro.Api --output-dir Data/Migraciones

      - name: Comprobar que compila y que no quedan cambios sin migrar
        run: |
          dotnet build ReservasPro.slnx -c Release -warnaserror
          dotnet ef migrations has-pending-model-changes --project src/ReservasPro.Api --no-build --configuration Release

      - name: Subir el commit
        env:
          NOMBRE: ${{ inputs.nombre }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ReservasPro.Api/Data/Migraciones
          if git diff --cached --quiet; then
            echo "No hay cambios en el modelo; no se creó ninguna migración."
            exit 0
          fi
          git commit -m "Add $NOMBRE migration"
          git push
